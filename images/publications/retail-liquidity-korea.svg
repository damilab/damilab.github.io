<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" role="img" aria-labelledby="title desc">
  <title id="title">Retail-dominated market liquidity concept</title>
  <desc id="desc">A conceptual summary of foreign net buying and short-horizon returns in less liquid Korean stocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#002472" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#0057b8"/></marker>
  </defs>
  <rect width="700" height="500" rx="22" fill="url(#bg)"/>
  <text x="48" y="64" fill="#002472" font-family="Arial, sans-serif" font-size="23" font-weight="700">Korean retail-dominated market</text>
  <text x="48" y="93" fill="#4b5b70" font-family="Arial, sans-serif" font-size="16">Conceptual summary of the study</text>
  <g filter="url(#shadow)">
    <rect x="48" y="136" width="250" height="245" rx="18" fill="#fff"/>
    <rect x="402" y="136" width="250" height="245" rx="18" fill="#fff"/>
  </g>
  <text x="74" y="177" fill="#17324d" font-family="Arial, sans-serif" font-size="19" font-weight="700">Less-liquid stocks</text>
  <path d="M78 321 C118 278, 154 350, 193 282 S253 310, 272 237" fill="none" stroke="#b9c5d5" stroke-width="5" stroke-linecap="round"/>
  <path d="M78 321 C118 278, 154 350, 193 282 S253 310, 272 237" fill="none" stroke="#dbe4ef" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="113" cy="298" r="11" fill="#ffbd3c"/><circle cx="153" cy="325" r="11" fill="#ffbd3c"/><circle cx="198" cy="281" r="11" fill="#ffbd3c"/><circle cx="240" cy="301" r="11" fill="#ffbd3c"/>
  <text x="76" y="352" fill="#8a6111" font-family="Arial, sans-serif" font-size="14">Domestic retail trading</text>
  <path d="M304 258 C337 258, 359 258, 394 258" fill="none" stroke="#0057b8" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="319" y="229" fill="#0057b8" font-family="Arial, sans-serif" font-size="16" font-weight="700">Foreign net buying</text>
  <text x="429" y="177" fill="#17324d" font-family="Arial, sans-serif" font-size="19" font-weight="700">Short horizon</text>
  <path d="M433 326 L433 280 L476 280 L476 247 L519 247 L519 209 L565 209" fill="none" stroke="#16a06d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="433" cy="326" r="8" fill="#16a06d"/><circle cx="476" cy="280" r="8" fill="#16a06d"/><circle cx="519" cy="247" r="8" fill="#16a06d"/><circle cx="565" cy="209" r="8" fill="#16a06d"/>
  <text x="429" y="356" fill="#147958" font-family="Arial, sans-serif" font-size="15" font-weight="700">Positive future returns</text>
  <rect x="48" y="413" width="604" height="45" rx="12" fill="#002472"/>
  <text x="350" y="442" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="600">Liquidity provision in a retail-dominated market</text>
</svg>
